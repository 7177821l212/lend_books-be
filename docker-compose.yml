version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://lendbook:lendbook@db:5432/lendbook
      - PUBLIC_BASE_URL=http://localhost:8000
      - LOCAL_UPLOAD_DIR=/app/uploads
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - uploads_data:/app/uploads
      # Add this line once you place your GCS service-account key at ./gcs-key.json:
      # - ./gcs-key.json:/app/gcs-key.json:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lendbook
      POSTGRES_PASSWORD: lendbook
      POSTGRES_DB: lendbook
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lendbook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  uploads_data:
